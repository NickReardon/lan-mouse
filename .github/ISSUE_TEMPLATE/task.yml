name: Focused task or initiative
description: Plan one responsibility, or coordinate a larger initiative through sub-issues.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Plans, human approval, and ownership live on the issue.
        Submitting this form does not approve or claim work. A human must approve the
        current plan revision before an agent claims it or creates an implementation branch.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Feature
        - Confirmed bug
        - Investigation (unverified concern)
        - Maintenance or documentation
        - Parent initiative (split implementation into sub-issues)
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Problem and single outcome
      description: Describe one responsibility. For a parent, state the overall outcome and planned sub-issues.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and reproduction
      description: For confirmed bugs, include reproduction steps, expected/actual behavior, OS/backend, and evidence. Mark unverified concerns as investigations.
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what changes and what stays outside this issue. Split unrelated work into separate issues.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Plan revision
      description: Increment for material scope, acceptance, or agreed-interface changes; preserve approved revisions.
      value: "1"
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Proposed plan
      description: List concrete steps. Identify data, ownership, transformations, and relevant access patterns; justify abstraction or performance-sensitive layout changes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions required before the implementation is ready for review.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Parent, sub-issues, dependencies, and shared interfaces
      description: Link related issues and blockers. For parallel work, record agreed interfaces and the integration owner. Write none if independent.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Identify local checks, affected-crate tests, required target-OS verification, and any representative performance workload.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Next step: human review of this plan revision. Use the approval and claim
        templates in CONTRIBUTING.md. Do not self-approve, pre-claim, or create a
        branch before approval. Implementation progress belongs in a linked draft PR.
